name: vulntrack

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # The browser reaches Keycloak on localhost, the app reaches it as "keycloak".
      # Both get the same issuer, and the app's back-channel calls stay inside Docker.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the client secret in the realm import.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes/vulntrack:/opt/keycloak/themes/vulntrack:ro
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      # The Keycloak image has no curl, so the health endpoint is called with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  # No published port, so only the app can reach the database.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vulntrack
      POSTGRES_USER: vulntrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vulntrack", "-d", "vulntrack"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Database=vulntrack;Username=vulntrack;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      Oidc__MetadataAddress: http://keycloak:8080/realms/vulntrack/.well-known/openid-configuration
      Keycloak__AdminUrl: http://keycloak:8080/admin/realms/vulntrack
      Oidc__RequireHttpsMetadata: "false"
    # Mounted as a file in /run/secrets, so the key doesn't show up in the container's environment.
    secrets:
      - source: encryption_key
        target: Encryption__Key
    ports:
      - 127.0.0.1:8000:8080

volumes:
  postgres-data:

secrets:
  encryption_key:
    environment: ENCRYPTION_KEY
